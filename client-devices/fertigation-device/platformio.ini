; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = .env.user.ini
default_envs = seeed_xiao_esp32c6

[env:seeed_xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
build_flags =
	${common.build_flags}
	-D APP_DEVICE_KIND=\"FGT\"
	-D APP_FIRMWARE_VERSION=\"0.1.0\"
	-D APP_FIRMWARE_BUILD_ID=\"2026-07-18T00:00:00+0900+local\"
	-D APP_FIRMWARE_PROJECT=\"fertigation-device\"
	-D APP_FIRMWARE_TARGET=\"seeed_xiao_esp32c6\"
	-D APP_FIRMWARE_FRAMEWORK=\"arduino\"
	-Wl,-u,INAS_FIRMWARE_MANIFEST
	-D APP_FACTORY_RESET_BUTTON_PIN=9
	-D APP_RS485_UART_NUM=1
	-D APP_RS485_TX_PIN=16
	-D APP_RS485_RX_PIN=17
	-D APP_RS485_DE_PIN=19
	-D APP_RS485_BAUD=4800
	-D APP_RS485_USE_IDF_HALF_DUPLEX=1
	-D APP_RS485_RX_PULLUP=1
	-D APP_RS485_INIT_SETTLE_MS=20
	-D APP_RS485_INTER_REQUEST_DELAY_MS=30
	-D APP_SENSOR_12V_POWER_PIN=20
	-D APP_SENSOR_12V_POWER_ACTIVE_HIGH=1
	-D APP_FGT_BATTERY_ADC_PIN=0
	-D APP_FGT_BATTERY_ADC_SAMPLES=16
	-D APP_FGT_BATTERY_DIVIDER_RATIO=2.0F
	-D APP_FGT_WATER_OUTPUT_PIN=1
	-D APP_FGT_NUTRIENT_A_OUTPUT_PIN=2
	-D APP_FGT_NUTRIENT_B_OUTPUT_PIN=21
	-D APP_FGT_MIXER_OUTPUT_PIN=22
	-D APP_FGT_IRRIGATION_OUTPUT_PIN=23
	-D APP_FGT_FLOW_PULSE_PIN=-1
	${user.network_flags}
lib_deps =
	bblanchon/ArduinoJson@^7.1.0
	ESP32Async/ESPAsyncWebServer@^3.8.1
	ESP32Async/AsyncTCP@^3.3.2
	links2004/WebSockets@^2.6.1
	knolleary/pubsubclient@^2.8

[env:native]
platform = native
test_framework = unity
test_filter = test_fgt_core
build_flags =
	-std=gnu++17
	-I lib/fgt-core/src

[common]
build_flags =
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
	-D BOARD_HAS_PSRAM=1
	-D CONFIG_ASYNC_TCP_QUEUE_SIZE=65536
	-D CONFIG_ASYNC_TCP_RUNNING_CORE=1
	-D CONFIG_ASYNC_TCP_STACK_SIZE=4096
	-D WS_MAX_QUEUED_MESSAGES=1
	-D MQTT_MAX_PACKET_SIZE=65535
	-D MQTT_KEEPALIVE=60
	-D MQTT_SOCKET_TIMEOUT=60
	-I src/app/inc
	-I src/hal/inc
	-I lib/fgt-core/src
	-I lib/ina-client-common/src/app/inc
	-I lib/ina-client-common/src/hal/inc

[user]
network_flags =
	-D APP_INITIAL_SETTING_SSID="\"INAS-FGT-setup\""
