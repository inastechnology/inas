[platformio]
extra_configs = .env.user.ini
default_envs = seeed_xiao_esp32s3

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
build_flags =
    ${common.build_flags}
    -D APP_DEVICE_KIND=\"FGT\"
    -D APP_FIRMWARE_VERSION=\"0.1.0\"
    -D APP_FIRMWARE_BUILD_ID=\"2026-07-18T00:00:00+0900+local\"
    -D APP_FIRMWARE_PROJECT=\"fertigation-device\"
    -D APP_FIRMWARE_TARGET=\"seeed_xiao_esp32s3\"
    -D APP_FIRMWARE_FRAMEWORK=\"arduino\"
    -Wl,-u,INAS_FIRMWARE_MANIFEST
    -D APP_RS485_UART_NUM=1
    -D APP_RS485_TX_PIN=43
    -D APP_RS485_RX_PIN=44
    -D APP_RS485_DE_PIN=5
    -D APP_RS485_BAUD=4800
    -D APP_SENSOR_12V_POWER_PIN=D8
    -D APP_SENSOR_12V_POWER_ACTIVE_HIGH=1
    -D APP_SENSOR_12V_POWER_SETTLE_MS=800
    -D APP_FGT_I2C_SDA_PIN=D0
    -D APP_FGT_I2C_SCL_PIN=D1
    -D APP_FGT_MASTER_ENABLE_PIN=D3
    -D APP_FGT_FLOW_PULSE_PIN=D5
    -D APP_FGT_MCP23017_ADDRESS=0x20
    ${user.network_flags}
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    esphome/ESPAsyncWebServer-esphome@^3.3.0
    links2004/WebSockets@^2.6.1
    knolleary/pubsubclient@^2.8

[env:native]
platform = native
test_framework = unity
test_filter = test_fgt_core
build_flags =
    -std=gnu++17
    -I lib/fgt-core/src

[common]
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D BOARD_HAS_PSRAM=1
    -D CONFIG_ASYNC_TCP_QUEUE_SIZE=65536
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
    -D CONFIG_ASYNC_TCP_STACK_SIZE=4096
    -D WS_MAX_QUEUED_MESSAGES=1
    -D MQTT_MAX_PACKET_SIZE=65535
    -D MQTT_KEEPALIVE=60
    -D MQTT_SOCKET_TIMEOUT=60
    -I src/app/inc
    -I src/hal/inc
    -I lib/fgt-core/src
    -I lib/ina-client-common/src/app/inc
    -I lib/ina-client-common/src/hal/inc
