; Generated by client-devices/scripts/create_device_project.py and customized for WRS

[platformio]
extra_configs = .env.user.ini

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
build_flags =
    ${common.build_flags}
    -D APP_DEVICE_KIND=\"WRS\"
    -D APP_FIRMWARE_VERSION=\"0.1.0\"
    -D APP_FIRMWARE_BUILD_ID=\"2026-07-12T00:00:00+0900+local\"
    -D APP_FIRMWARE_PROJECT=\"watering-rs485-device\"
    -D APP_FIRMWARE_TARGET=\"seeed_xiao_esp32s3\"
    -D APP_FIRMWARE_FRAMEWORK=\"arduino\"
    -Wl,-u,INAS_FIRMWARE_MANIFEST
    -D APP_RS485_UART_NUM=1
    -D APP_RS485_TX_PIN=43
    -D APP_RS485_RX_PIN=44
    -D APP_RS485_DE_PIN=5
    -D APP_RS485_BAUD=4800
    -D APP_SENSOR_12V_POWER_PIN=D8
    -D APP_SENSOR_12V_POWER_ACTIVE_HIGH=1
    -D APP_SENSOR_12V_POWER_SETTLE_MS=800
    -D APP_WRS_IRRIGATION1_PIN=D2
    -D APP_WRS_IRRIGATION2_PIN=D3
    -D APP_WRS_OUTPUT_ACTIVE_HIGH=1
    -D APP_WRS_SOIL_RS485_ENABLED=1
    -D APP_WRS_SOIL_MODBUS_SLAVE_ID=2
    -D APP_WRS_SOIL_MODBUS_FUNCTION=4
    -D APP_WRS_SOIL_MODBUS_START_REGISTER=0
    -D APP_WRS_PAR_ENABLED=0
    -D APP_WRS_PAR_MODBUS_SLAVE_ID=1
    -D APP_WRS_PAR_MODBUS_FUNCTION=3
    -D APP_WRS_PAR_REGISTER=0
    -D APP_WRS_PAR_SCALE=1.0f
    -D APP_WRS_SENSOR_POWER_SETTLE_MS=800
    -D APP_WRS_WATERING_MAX_DURATION_SEC=60
    -D APP_WRS_WATERING_CHECK_INTERVAL_SEC=10
    -D APP_WRS_WATERING_STOP_MOISTURE_PERCENT=55
    -D APP_WRS_WATERING_CHANNEL_MASK=0x1
    ${user.network_flags}
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    esphome/ESPAsyncWebServer-esphome@^3.3.0
    links2004/WebSockets@^2.6.1
    knolleary/pubsubclient@^2.8

[common]
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D BOARD_HAS_PSRAM=1
    -D CONFIG_ASYNC_TCP_QUEUE_SIZE=65536
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
    -D CONFIG_ASYNC_TCP_STACK_SIZE=4096
    -D WS_MAX_QUEUED_MESSAGES=1
    -D MQTT_MAX_PACKET_SIZE=65535
    -D MQTT_KEEPALIVE=60
    -D MQTT_SOCKET_TIMEOUT=60
    -I src/app/inc
    -I src/hal/inc
    -I lib/ina-client-common/src/app/inc
    -I lib/ina-client-common/src/hal/inc
