name: Edge Runtime CI

on:
  pull_request:
    paths:
      - "shared/edge-runtime/**"
      - "shared/contracts/sync/v1/**"
      - ".github/workflows/edge-runtime-ci.yml"
  push:
    branches: [main]
    paths:
      - "shared/edge-runtime/**"
      - "shared/contracts/sync/v1/**"
      - ".github/workflows/edge-runtime-ci.yml"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared/edge-runtime
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          working-directory: shared/edge-runtime
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run python -m unittest discover -s tests -p "test_*.py"
      - run: uv build --out-dir "${RUNNER_TEMP}/edge-runtime-dist"
