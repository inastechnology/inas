[project]
name = "ina-device-hub"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Polonity", email = "hiken.pc@gmail.com" }
]
dependencies = [
    "paho-mqtt>=2.1.0",
    "dotenv>=0.9.9",
    "libsql>=0.1.11",
    "boto3>=1.37.11",
    "flask>=3.1.0",
    "ffmpeg-python>=0.2.0",
    "apscheduler>=3.11.0",
    "plotly>=6.0.0",
    "pyjwt[crypto]>=2.10.1",
    "waitress>=3.0.2",
]
readme = "README.md"
requires-python = ">= 3.11"

[project.scripts]
ina-hub = "ina_device_hub.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.9.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ina_device_hub"]

[tool.ruff]
exclude = [".git", ".mypy_cache", ".ruff_cache", ".venv", "third_party"]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []
select = [
    "A",  # flake8-builtin
    "B",  # flake8-bugbear
    "E",  # pycodestyle error
    "F",  # Pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "W",  # pycodestyle warning
    "PL", # Pylint
    "UP", # pyupgrade
]
ignore = [
    "B905",    # Zip-without-explicit-strict
    "E501",    # Line too long
    "F403",    # Unable to detect undefined names
    "N812",    # Lowercase imported as non-lowercase
    "N999",    # Invalid module name
    "N803",    # Existing MQTT protocol field names use seqId/imageBytes
    "PLC0415", # Delayed imports are used after environment preparation and to avoid cycles
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments in function definition
    "PLR0911", # Existing protocol decision functions have explicit early returns
    "PLR0915", # Large orchestration and integration-test methods remain intentionally linear
    "PLR2004", # Magic value used in comparison
    "PLW0603", # Existing repository singletons use module-level lazy instances
]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
