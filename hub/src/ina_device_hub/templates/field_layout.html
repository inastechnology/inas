<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ field.name }} - 設置ビュー</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/admin-layout/installation-layout.css">
    <link rel="stylesheet" href="/static/hub-ui.css">
  </head>
  <body class="hub-shell hub-field-layout {{ accessibility_body_class }}">
    <div
      id="installation-layout-root"
      data-field-id="{{ field.id }}"
      data-field-name="{{ field.name }}"
      data-field-detail-url="/fields/{{ field.id }}"
    >
      <div class="layout-loading inas-loading-state" role="status" aria-live="polite" aria-busy="true">
        <span class="inas-activity large" aria-hidden="true"><span class="inas-activity-field"></span><span class="inas-activity-sprout"></span></span>
        <span class="inas-loading-copy"><strong>設置ビューを読み込んでいます</strong><span>設備と栽培エリアの接続状態を整えています</span></span>
        <span class="inas-loading-signal" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
    </div>
    <noscript>設置ビューを使用するには JavaScript を有効にしてください。</noscript>
    <script src="/static/context-help.js"></script>
    <script type="module" src="/static/admin-layout/installation-layout.js"></script>
  </body>
</html>
