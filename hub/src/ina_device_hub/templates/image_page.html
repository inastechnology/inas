<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/searchable-select.css" />
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        text-align: center;
      }
      img {
        max-width: 100%;
        height: auto;
        margin: 0 auto;
      }
      .image-container {
        margin-bottom: 20px;
        position: relative;
      }
      .timestamp {
        text-align: center;
        font-size: 14px;
        color: #555;
        margin-top: 5px;
      }
      select {
        padding: 8px;
        font-size: 16px;
        margin-bottom: 20px;
      }
      #imageSelect + .static-searchable-select {
        max-width: 360px;
        margin: 0 auto 20px;
      }
      .image-filter {
        display: grid;
        gap: 5px;
        max-width: 360px;
        margin: 0 auto 10px;
        color: #555;
        font-size: 13px;
        font-weight: 700;
        text-align: left;
      }
      .image-filter input {
        min-height: 38px;
        padding: 7px 9px;
        border: 1px solid #aaa;
        border-radius: 4px;
        font: inherit;
      }
      .image-loader {
        position: absolute;
        top: 50%;
        left: 50%;
        display: none;
        padding: 10px 13px;
        border: 1px solid #c6d8cd;
        border-radius: 8px;
        background: rgba(249, 252, 250, .96);
        box-shadow: 0 8px 24px rgba(30, 65, 46, .14);
        transform: translate(-50%, -50%);
      }
    </style>
    <link rel="stylesheet" href="/static/hub-ui.css">
  </head>
  <body class="hub-shell hub-media {{ accessibility_body_class }}">
    <header><a href="/fields">圃場一覧</a><h1>定点画像</h1><p>機器 {{ device_id }} が撮影した画像を時刻順に確認します。</p></header>

    <select id="imageSelect" onchange="displayImage()" aria-label="表示する画像" data-searchable-select data-search-placeholder="撮影日時、画像パスを検索" data-empty-message="一致する画像はありません。">
      {% for image in sensor_images %}
      <option
        value="{{ image.image_path }}"
        data-created-at="{{ image.created_at }}"
      >
        {{ image.created_at }}
      </option>
      {% endfor %}
    </select>

    <div class="image-container">
      <div class="image-loader inas-inline-loading" id="loader" role="status" aria-live="polite" aria-busy="true"><span class="inas-activity small" aria-hidden="true"><span class="inas-activity-field"></span><span class="inas-activity-sprout"></span></span><span>画像を読み込んでいます</span></div>
      <img id="displayedImage" src="" alt="Sensor Image" />
      <div class="timestamp" id="imageTimestamp"></div>
    </div>

    <script src="/static/select-filter.js"></script>
    <script>
      function displayImage() {
        const selectElement = document.getElementById("imageSelect");
        const imagePath = selectElement.value;
        const createdAt =
          selectElement.options[selectElement.selectedIndex].getAttribute(
            "data-created-at"
          );
        const displayedImage = document.getElementById("displayedImage");
        const timestamp = document.getElementById("imageTimestamp");
        const loader = document.getElementById("loader");

        console.log("imagePath:", imagePath); // コンソールで確認

        loader.style.display = "inline-flex";
        displayedImage.style.display = "none";
        timestamp.textContent = "";

        fetch(`/local/api/images/${encodeURIComponent(imagePath)}`)
          .then((response) => response.blob())
          .then((blob) => {
            const url = URL.createObjectURL(blob);
            displayedImage.src = url;
            displayedImage.onload = () => {
              loader.style.display = "none";
              displayedImage.style.display = "block";
              timestamp.textContent = createdAt;
            };
          })
          .catch((error) => {
            loader.style.display = "none";
            console.error("Error fetching image:", error);
          });
      }

      // 初期表示
      document.addEventListener("DOMContentLoaded", displayImage);
    </script>
  </body>
</html>
