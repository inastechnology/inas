<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI設定 - INA Device Hub</title>
    <style>
      :root { --ink:#1d2721; --muted:#66736b; --line:#d4ddd7; --green:#176b52; --surface:#fff; --bg:#f3f5f2; }
      * { box-sizing:border-box; }
      body { margin:0; color:var(--ink); background:var(--bg); font-family:system-ui,sans-serif; }
      button,input { font:inherit; }
      header { background:#fff; border-bottom:1px solid var(--line); }
      header div,main { width:min(980px,100%); margin:auto; padding:20px 28px; }
      a { color:var(--green); }
      h1 { margin:6px 0 0; font-size:26px; letter-spacing:0; }
      .eyebrow { color:var(--green); font-size:12px; font-weight:800; }
      .notice { padding:12px 14px; border:1px solid #9cc9b7; background:#eaf5ef; }
      form { display:grid; gap:16px; }
      .provider { background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:20px; }
      .provider h2 { margin:0 0 6px; font-size:19px; }
      .provider > p { margin:0 0 18px; color:var(--muted); }
      .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
      label { display:grid; gap:6px; font-size:13px; font-weight:700; }
      label.wide { grid-column:1/-1; }
      input { width:100%; min-height:42px; border:1px solid #b8c5bd; border-radius:4px; padding:8px 10px; background:#fff; }
      .toggle { display:flex; align-items:center; gap:9px; }
      .toggle input { width:18px; min-height:18px; }
      .key-state { color:var(--muted); font-size:12px; font-weight:500; }
      .actions { display:flex; justify-content:space-between; gap:12px; align-items:center; }
      button { min-height:40px; border:1px solid var(--green); border-radius:4px; padding:8px 14px; color:var(--green); background:#fff; font-weight:750; cursor:pointer; }
      button.primary { color:#fff; background:var(--green); }
      button:disabled { opacity:.55; cursor:wait; }
      .test-result { min-height:20px; color:var(--muted); font-size:13px; }
      .test-result.ok { color:#166447; }
      .test-result.error { color:#a13d35; }
      @media (max-width:700px) { header div,main { padding:16px; } .grid { grid-template-columns:1fr; } label.wide { grid-column:auto; } .actions { align-items:stretch; flex-direction:column; } .actions button { width:100%; } }
    </style>
  </head>
  <body>
    <header><div><a href="/fields">圃場一覧</a><div class="eyebrow">DEVICE HUB</div><h1>AI設定</h1></div></header>
    <main>
      {% if saved %}<p class="notice" role="status">AI設定を保存しました。</p>{% endif %}
      <form method="post" id="ai-settings-form">
        <label class="toggle"><input type="checkbox" name="enabled"{% if ai.enabled %} checked{% endif %}>AI機能を有効にする</label>
        {% for channel, title, description in [('text', 'テキスト・栽培計画', '栽培カレンダー、目標レンジ、質問回答に使用します。'), ('image', '画像解析', '植物画像や定点観察の解析に使用します。')] %}
        <section class="provider" data-ai-provider="{{ channel }}">
          <h2>{{ title }}</h2><p>{{ description }}</p>
          <div class="grid">
            <label class="wide">OpenAI互換 Base URL<input name="{{ channel }}_analyze_base_url" value="{{ ai[channel + '_analyze_base_url'] }}" placeholder="https://api.openai.com/v1"></label>
            <label>モデル<input name="{{ channel }}_analyze_model" value="{{ ai[channel + '_analyze_model'] }}" placeholder="利用するモデルID"></label>
            <label>APIキー <span class="key-state">{% if ai[channel + '_key_configured'] %}登録済み・変更時のみ入力{% else %}未登録{% endif %}</span><input type="password" name="{{ channel }}_analyze_api_key" autocomplete="new-password" placeholder="{% if ai[channel + '_key_configured'] %}変更しない場合は空欄{% else %}APIキー{% endif %}"></label>
          </div>
          <div class="actions"><span class="test-result" aria-live="polite"></span><button type="button" data-test-ai>接続を確認</button></div>
        </section>
        {% endfor %}
        <div class="actions"><span>未設定または呼び出し失敗時は標準案を使用します。</span><button class="primary" type="submit">設定を保存</button></div>
      </form>
    </main>
    <script>
      document.querySelectorAll("[data-ai-provider]").forEach((section) => {
        const button = section.querySelector("[data-test-ai]");
        const result = section.querySelector(".test-result");
        button.addEventListener("click", async () => {
          const channel = section.dataset.aiProvider;
          const form = document.getElementById("ai-settings-form");
          button.disabled = true; result.className = "test-result"; result.textContent = "接続確認中...";
          try {
            const response = await fetch("/local/api/settings/ai/test", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ channel, base_url:form.elements[`${channel}_analyze_base_url`].value, model:form.elements[`${channel}_analyze_model`].value, api_key:form.elements[`${channel}_analyze_api_key`].value }) });
            const body = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
            result.className = "test-result ok"; result.textContent = `接続できました: ${body.model}`;
          } catch (error) {
            result.className = "test-result error"; result.textContent = error instanceof Error ? error.message : "接続できませんでした";
          } finally { button.disabled = false; }
        });
      });
    </script>
  </body>
</html>
