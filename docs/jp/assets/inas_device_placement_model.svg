<rect x="100" y="120" width="270" height="140" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="3"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a"><tspan x="235" y="159">圃場</tspan><tspan x="235" y="185">作物・品種</tspan><tspan x="235" y="211">栽培方式</tspan><tspan x="235" y="237">目標レンジ</tspan></text>
<rect x="470" y="100" width="260" height="110" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a"><tspan x="600" y="150">区画</tspan><tspan x="600" y="176">作物や条件が違う単位</tspan></text>
<rect x="470" y="270" width="260" height="110" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a"><tspan x="600" y="320">畝 / ベッド</tspan><tspan x="600" y="346">水分・灌水対象の単位</tspan></text>
<rect x="470" y="440" width="260" height="110" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a"><tspan x="600" y="490">測点</tspan><tspan x="600" y="516">特定地点の代表値</tspan></text>
