<text text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a"><tspan x="990" y="352">SOI</tspan><tspan x="990" y="378">畝 / 測点</tspan><tspan x="990" y="404">土壌水分</tspan></text>
<rect x="870" y="500" width="240" height="120" rx="12" fill="#ecfccb" stroke="#65a30d" stroke-width="3"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a"><tspan x="990" y="542">WTR/WRS</tspan><tspan x="990" y="568">区画 / 畝</tspan><tspan x="990" y="594">灌水実行</tspan></text>
<rect x="1180" y="160" width="240" height="110" rx="12" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a"><tspan x="1300" y="197">カメラ</tspan><tspan x="1300" y="223">圃場全体 / 区画</tspan><tspan x="1300" y="249">画像観察</tspan></text>
<rect x="1180" y="390" width="260" height="150" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a"><tspan x="1310" y="434">生育フィードバック</tspan><tspan x="1310" y="460">測定値 + 作物前提</tspan><tspan x="1310" y="486">作業記録 + 画像</tspan><tspan x="1310" y="512">外部情報</tspan></text>
<rect x="70" y="870" width="1460" height="88" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="96" y="900" font-family="Arial, sans-serif" font-size="17" fill="#334155">- 小規模では ENV は圃場に 1 台でよい。圃場差・作物差が大きい場合だけ区画や畝へ細分化する。</text>
<text x="96" y="924" font-family="Arial, sans-serif" font-size="17" fill="#334155">- device_placements が、どの測定値をどの作物・区画の判断に使うかを決める。</text>
</svg>
