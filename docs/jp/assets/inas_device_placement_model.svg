<text text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a"><tspan x="990" y="149">ENV</tspan><tspan x="990" y="175">圃場全体または区画</tspan><tspan x="990" y="201">気温・湿度・日射</tspan><tspan x="990" y="227">EC/pH/NPK</tspan></text>
