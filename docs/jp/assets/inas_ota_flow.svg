<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="60" y="62" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#0f172a">OTA firmware 配信仕様</text>
<line x1="330" y1="215" x2="410" y2="215" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="280" y="185" width="180" height="34" rx="8" fill="#f8fafc" fill-opacity="0.92"/>
<text x="370" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#475569">make check-firmware</text>
<line x1="650" y1="215" x2="730" y2="195" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="600" y="175" width="180" height="34" rx="8" fill="#f8fafc" fill-opacity="0.92"/>
<text x="690" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#16a34a">ファイル選択</text>
<line x1="990" y1="195" x2="1080" y2="195" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="945" y="165" width="180" height="34" rx="8" fill="#f8fafc" fill-opacity="0.92"/>
<text x="1035" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#475569">binary 保存</text>
<line x1="860" y1="270" x2="860" y2="360" stroke="#65a30d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="770" y="285" width="180" height="34" rx="8" fill="#f8fafc" fill-opacity="0.92"/>
<text x="860" y="307" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#65a30d">自動登録</text>
<line x1="990" y1="425" x2="1080" y2="420" stroke="#d97706" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="945" y="392" width="180" height="34" rx="8" fill="#f8fafc" fill-opacity="0.92"/>
<text x="1035" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#d97706">URL を offer</text>
<line x1="1230" y1="480" x2="880" y2="610" stroke="#d97706" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="965" y="515" width="180" height="34" rx="8" fill="#f8fafc" fill-opacity="0.92"/>
<text x="1055" y="537" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#d97706">URL 通知</text>
<line x1="1240" y1="260" x2="880" y2="610" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="970" y="405" width="180" height="34" rx="8" fill="#f8fafc" fill-opacity="0.92"/>
<text x="1060" y="427" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#dc2626">GET /firmware/...</text>
<line x1="1030" y1="670" x2="1080" y2="670" stroke="#d97706" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="965" y="640" width="180" height="34" rx="8" fill="#f8fafc" fill-opacity="0.92"/>
<text x="1055" y="662" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#d97706">結果 publish</text>
<rect x="90" y="160" width="240" height="110" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a"><tspan x="210" y="197">firmware build</tspan><tspan x="210" y="223">PlatformIO</tspan><tspan x="210" y="249">manifest 埋め込み</tspan></text>
<rect x="410" y="160" width="240" height="110" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="3"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a"><tspan x="530" y="197">format check</tspan><tspan x="530" y="223">INAS_FW_MANIFEST_V1</tspan><tspan x="530" y="249">sha256 / size</tspan></text>
<rect x="730" y="120" width="260" height="150" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a"><tspan x="860" y="177">Hub UI</tspan><tspan x="860" y="203">F/W 登録</tspan><tspan x="860" y="229">upload / register API</tspan></text>
<rect x="1080" y="130" width="320" height="130" rx="12" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a"><tspan x="1240" y="177">firmware 保存</tspan><tspan x="1240" y="203">WORK_DIR/firmware/</tspan><tspan x="1240" y="229">&lt;kind&gt;/&lt;version&gt;/firmware.bin</tspan></text>
<rect x="730" y="360" width="260" height="130" rx="12" fill="#ecfccb" stroke="#65a30d" stroke-width="3"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a"><tspan x="860" y="407">artifact 登録</tspan><tspan x="860" y="433">size / sha256 / URL</tspan><tspan x="860" y="459">http://host:39151/firmware/...</tspan></text>
<rect x="1080" y="360" width="300" height="120" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a"><tspan x="1230" y="402">MQTT OTA offer</tspan><tspan x="1230" y="428">制御情報のみ</tspan><tspan x="1230" y="454">retained</tspan></text>
<rect x="730" y="610" width="300" height="120" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a"><tspan x="880" y="652">device HTTP download</tspan><tspan x="880" y="678">firmware.bin</tspan><tspan x="880" y="704">現状 http:// のみ</tspan></text>
<rect x="1080" y="610" width="300" height="120" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a"><tspan x="1230" y="665">MQTT OTA status</tspan><tspan x="1230" y="691">受信・検証・適用結果</tspan></text>
<rect x="70" y="870" width="1460" height="88" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="96" y="900" font-family="Arial, sans-serif" font-size="17" fill="#334155">- MQTT は制御だけに使い、firmware 本体は Hub HTTP server から配信する。</text>
<text x="96" y="924" font-family="Arial, sans-serif" font-size="17" fill="#334155">- URL は hub.local 固定ではなく、FIRMWARE_BASE_URL / FIRMWARE_HOSTNAME / HOSTNAME から生成する。</text>
<text x="96" y="948" font-family="Arial, sans-serif" font-size="17" fill="#334155">- HTTPS はデバイス側の証明書検証を実装してから有効化する。</text>
</svg>
