<text text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a"><tspan x="1045" y="147">4. UI 表示</tspan><tspan x="1045" y="173">グラフ・カード</tspan><tspan x="1045" y="199">履歴</tspan></text>
<rect x="930" y="290" width="230" height="130" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a"><tspan x="1045" y="337">5. 圃場前提</tspan><tspan x="1045" y="363">作物・品種</tspan><tspan x="1045" y="389">目標レンジ</tspan></text>
