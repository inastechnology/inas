<text text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a"><tspan x="1345" y="277">6. 判断候補</tspan><tspan x="1345" y="303">灌水・液肥・噴霧</tspan><tspan x="1345" y="329">現状は灌水のみ実行</tspan></text>
<rect x="1220" y="470" width="250" height="110" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a"><tspan x="1345" y="507">7. 承認 / 記録</tspan><tspan x="1345" y="533">action_plans</tspan><tspan x="1345" y="559">人間評価</tspan></text>
<rect x="870" y="550" width="260" height="120" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a"><tspan x="1000" y="592">8. device config</tspan><tspan x="1000" y="618">または灌水指示</tspan><tspan x="1000" y="644">MQTT publish</tspan></text>
<rect x="520" y="540" width="230" height="130" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a"><tspan x="635" y="587">9. 実行</tspan><tspan x="635" y="613">WTR/WRS ポンプ</tspan><tspan x="635" y="639">バルブ制御</tspan></text>
<rect x="180" y="510" width="230" height="110" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a"><tspan x="295" y="560">10. 結果観測</tspan><tspan x="295" y="586">次回起床で評価</tspan></text>
<rect x="70" y="870" width="1460" height="88" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="96" y="900" font-family="Arial, sans-serif" font-size="17" fill="#334155">- 営農者向け UI は変数名ではなく、水やり日時、土壌水分、起動状態、次の判断候補を先に見せる。</text>
<text x="96" y="924" font-family="Arial, sans-serif" font-size="17" fill="#334155">- ENV/SOI/WTR/WRS の測定値は縦持ちの sensor_measurements に寄せ、device_kind ごとの固定 payload を正規化する。</text>
