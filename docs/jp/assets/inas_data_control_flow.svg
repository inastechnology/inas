<text text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a"><tspan x="725" y="197">3. hub 正規化</tspan><tspan x="725" y="223">sensor_measurements</tspan><tspan x="725" y="249">イベント保存</tspan></text>
