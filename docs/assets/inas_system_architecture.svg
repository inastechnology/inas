<text text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a"><tspan x="1150" y="107">Directory Turso</tspan><tspan x="1150" y="133">membership + nodes</tspan><tspan x="1150" y="159">encrypted DB tokens</tspan></text>
