<text text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a"><tspan x="810" y="129">Cloud Hub</tspan><tspan x="810" y="155">shared Worker + UI</tspan><tspan x="810" y="181">membership / node routing</tspan><tspan x="810" y="207">HTTPS Sync v1</tspan></text>
