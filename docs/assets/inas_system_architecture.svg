<rect x="70" y="870" width="1460" height="88" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="96" y="900" font-family="Arial, sans-serif" font-size="17" fill="#334155">- Cloud Hub uses one shared Worker and one dedicated Turso DB per customer; request data never selects a DB.</text>
<text x="96" y="924" font-family="Arial, sans-serif" font-size="17" fill="#334155">- Local Hub keeps its existing independent Turso/libSQL configuration and directly controls local devices.</text>
<text x="96" y="948" font-family="Arial, sans-serif" font-size="17" fill="#334155">- Each Edge Gateway chooses one parent. MQTT and safety-critical control stay on the field LAN during outages.</text>
