<text text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a"><tspan x="295" y="547">10. Observe result</tspan><tspan x="295" y="573">evaluate on</tspan><tspan x="295" y="599">next wake</tspan></text>
<rect x="70" y="870" width="1460" height="88" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="96" y="900" font-family="Arial, sans-serif" font-size="17" fill="#334155">- The grower UI should show irrigation time, soil moisture, wake state, and next action candidates before raw variable names.</text>
<text x="96" y="924" font-family="Arial, sans-serif" font-size="17" fill="#334155">- ENV/SOI/WTR/WRS payloads are normalized into vertical sensor_measurements records.</text>
