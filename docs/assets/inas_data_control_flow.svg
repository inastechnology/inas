<rect x="870" y="550" width="260" height="120" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a"><tspan x="1000" y="592">8. Device config</tspan><tspan x="1000" y="618">or irrigation command</tspan><tspan x="1000" y="644">MQTT publish</tspan></text>
<rect x="520" y="540" width="230" height="130" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a"><tspan x="635" y="587">9. Actuate</tspan><tspan x="635" y="613">WTR/WRS</tspan><tspan x="635" y="639">watering control</tspan></text>
