# Render credentials with mosquitto_passwd during provisioning. Never place
# plaintext passwords or claim tokens in this repository.
per_listener_settings false
listener 1883 192.168.50.1
allow_anonymous false
password_file /etc/mosquitto/inas/passwd
acl_file /etc/mosquitto/inas/acl

persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 300
max_packet_size 262144
message_size_limit 262144

connection_messages true
log_dest syslog
log_dest topic
