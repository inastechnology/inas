[project]
name = "ina-edge-gateway"
version = "0.1.0"
description = "Standalone INAS field gateway for local MQTT control and parent Sync v1"
requires-python = ">=3.11"
dependencies = [
    "ina-edge-runtime",
    "paho-mqtt>=2.1,<3",
]

[project.scripts]
ina-edge-gateway = "ina_edge_gateway.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.9.6",
]

[tool.uv.sources]
ina-edge-runtime = { path = "../shared/edge-runtime", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ina_edge_gateway"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "N", "PL", "UP", "W"]
ignore = ["E501", "PLR0913"]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
